name: Image

# Builds deploy/Dockerfile once Tests pass on a push to main, pushes it to GHCR, then tells Coolify
# to deploy. The prod host only pulls the image, so it never compiles Rust. Setup: deploy/README.md
# ("Coolify"). workflow_run can't filter by path, so a docs-only push redeploys too (cached, cheap);
# skipping it by diff could drop a code push whose Tests run a later push cancelled.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    # A passing Tests run of a push to main; a PR from a fork's `main` branch matches the filter too.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    env:
      # The commit Tests passed on; a manual run builds the ref it was started from.
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:${{ env.SHA }}
          # Lets ops tooling tell which commit a :main container runs.
          labels: org.opencontainers.image.revision=${{ env.SHA }}
          # Stamped on every agent turn in the turn log.
          build-args: GYMCLAW_COMMIT=${{ env.SHA }}
          # mode=max keeps the cargo-chef dependency layer, so source-only pushes skip compiling deps.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # COOLIFY_DEPLOY_WEBHOOK: the app's deploy webhook URL; COOLIFY_TOKEN: an API token with deploy rights.
      - name: Deploy on Coolify
        env:
          WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "COOLIFY_DEPLOY_WEBHOOK not set, skipping deploy"; exit 0; fi
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" "$WEBHOOK"
