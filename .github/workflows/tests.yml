name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # libheif >= 1.17 for HEIC photos (the `heic` feature).
      - run: sudo apt-get update && sudo apt-get install -y libheif-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: shellcheck -S warning deploy/*.sh deploy/egress/*.sh scripts/connect-personal-calendar scripts/render-illustrations scripts/shot .githooks/pre-commit

  secrets:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lists the PR's commits
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
