name: Tests

# Feature branches run once, via their PR. main runs again after a merge.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR supersedes the run in flight.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Debug info is never read in CI; skipping it shortens every compile and shrinks the cache.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # libheif >= 1.17 plus the HEVC decoder for HEIC photos (the `heic` feature).
      - run: sudo apt-get update && sudo apt-get install -y libheif-dev libheif-plugin-libde265
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: shellcheck -S warning deploy/*.sh deploy/egress/*.sh scripts/connect-personal-calendar scripts/render-illustrations scripts/shot .githooks/pre-commit

  secrets:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lists the PR's commits
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
