<!doctype html>
<!-- GymClaw feature film. One page, two cuts: features.html?cut=15 (reel) and ?cut=60 (tour).
     Every frame is a pure function of t; render.mjs calls window.render(t). -->
<html><head><meta charset="utf-8"><title>GymClaw Features</title>
<link rel="stylesheet" href="lib.css">
<style>
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(1200px 900px at 30% 55%,#1b2216 0%,var(--ink) 60%)}
#grid{position:absolute;inset:-80px;background-image:radial-gradient(circle,#2a3226 1.4px,transparent 1.6px);background-size:48px 48px}
#glow{position:absolute;width:1100px;height:1100px;border-radius:50%;left:-20px;top:-10px;
  background:radial-gradient(circle,rgba(215,245,128,.16),rgba(215,245,128,0) 62%)}
#bignum{position:absolute;right:-40px;top:40px;font:600 760px/1 Cond;color:transparent;-webkit-text-stroke:2px rgba(241,241,235,.07);letter-spacing:-20px}
#phoneWrap{left:530px;top:540px}

#side{position:absolute;left:930px;top:0;width:900px;height:1080px}
.ch{position:absolute;inset:0}
.kick{position:absolute;top:150px;left:0;font:600 22px DM;letter-spacing:5px;color:var(--lime);display:flex;gap:16px;align-items:center}
.kick b{display:inline-block;width:44px;height:2px;background:var(--lime)}
.head{position:absolute;top:196px;left:-6px;font:600 134px/0.92 Cond;text-transform:uppercase;letter-spacing:-1px;color:var(--paper)}
.head .hl{color:var(--lime)}
.sub{position:absolute;top:500px;left:0;width:800px;font:400 27px/1.38 DM;color:#c6ccbf}
.sub em{font-style:normal;color:var(--paper);font-weight:600}
.viz{position:absolute;left:0;top:600px;width:860px;height:380px}

.tag{position:absolute;white-space:nowrap;padding:6px 12px;border-radius:30px;font:600 15px DM;letter-spacing:1px}
.tag.line{border:2px solid #3a4335;color:#c6ccbf}
.tag.solid{background:var(--lime);color:var(--ink)}
.axis{position:absolute;font:600 15px DM;color:#8a9284;letter-spacing:2px;white-space:nowrap}
.hatch{background:repeating-linear-gradient(45deg,#3a4150 0 6px,#262c36 6px 12px)!important}

/* setup */
.note{position:absolute;left:0;top:0;width:300px;height:360px;border-radius:6px;background:#efeadb;color:#24306b;padding:22px 24px;
  font:600 25px/1.32 Cond;box-shadow:0 30px 60px rgba(0,0,0,.5);overflow:hidden;
  background-image:repeating-linear-gradient(#efeadb 0 32px,#cfd6e6 32px 33px)}
.note h4{font:600 34px/1 Cond;margin-bottom:8px;text-decoration:underline}
.note div{white-space:nowrap}
#nScan{position:absolute;left:0;right:0;height:5px;background:var(--lime);box-shadow:0 0 24px 8px rgba(215,245,128,.55)}
.xrow{position:absolute;left:380px;width:470px;height:70px;border-radius:16px;background:#1c2219;border:2px solid #333b2f;display:flex;align-items:center;gap:16px;padding:0 18px}
.xrow img{width:52px;height:52px;border-radius:10px}
.xrow .n{font:600 30px/1 Cond;text-transform:uppercase;color:var(--paper)}
.xrow .d{font:600 15px DM;letter-spacing:2px;color:#9aa293;margin-top:4px}

/* plan heatmap */
.hm{position:absolute;left:70px;top:22px}
.cell{position:absolute;width:98px;height:62px;border-radius:12px}
.cell .lab{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;font:700 15px/1.05 DM;color:var(--ink);letter-spacing:1px}
.cell .lab small{font:600 22px Cond;letter-spacing:0}
#scan{position:absolute;top:10px;width:4px;height:300px;border-radius:2px;background:var(--lime);box-shadow:0 0 30px 8px rgba(215,245,128,.45)}

/* replan week */
.wk{position:absolute;left:70px;top:30px}
.col{position:absolute;top:0;width:104px;height:270px;border-radius:12px;background:#171c15;border:1px solid #262d23}
.blk{position:absolute;width:104px;border-radius:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;font:700 14px/1.1 DM;letter-spacing:1px;color:var(--ink)}
.blk small{font:600 22px Cond;letter-spacing:0}

/* charts + stats */
.stat{position:relative;white-space:nowrap;font:600 200px/0.82 Cond;color:var(--paper);letter-spacing:-2px}
.unit{white-space:nowrap;font:600 28px DM;letter-spacing:3px;color:#9aa293}
.pill{position:absolute;height:52px;width:150px;border-radius:30px;border:2px solid #3a4335;font:700 17px DM;letter-spacing:2px;display:grid;place-items:center;color:#8a9284}
.card{position:absolute;width:236px;height:320px;border-radius:22px;background:#1c2219;border:2px solid #333b2f;overflow:hidden}
.card img{display:block;width:232px;height:232px;object-fit:cover}
.card .nm{padding:12px 16px 0;font:600 30px/1 Cond;text-transform:uppercase;color:var(--paper);white-space:nowrap}
.card .st{padding:4px 16px;font:600 14px DM;letter-spacing:2px;color:#8a9284;white-space:nowrap}
.stamp{position:absolute;left:24px;top:84px;padding:8px 14px;border:4px solid var(--hot);color:var(--hot);border-radius:10px;font:700 30px/1 Cond;letter-spacing:3px;background:rgba(15,18,14,.75)}

/* under the hood */
.node{position:absolute;border-radius:18px;background:#1c2219;border:2px solid #3a4335;padding:14px 18px;white-space:nowrap}
.node b{display:block;font:600 30px/1 Cond;text-transform:uppercase;color:var(--paper)}
.node span{display:block;margin-top:6px;font:600 14px DM;letter-spacing:1.5px;color:#9aa293}
.node.hot{border-color:var(--lime)}
#sandbox{position:absolute;left:220px;top:16px;width:650px;height:262px;border:2px dashed #55604c;border-radius:24px}
#sandbox i{position:absolute;left:18px;top:-12px;padding:0 10px;background:#11150f;font:700 13px DM;font-style:normal;letter-spacing:3px;color:var(--lime)}
.job{position:absolute;top:322px;height:46px;padding:0 16px;border-radius:24px;border:2px solid #3a4335;display:flex;align-items:center;gap:8px;font:700 14px DM;letter-spacing:1.5px;color:#c6ccbf;white-space:nowrap}

#tl{position:absolute;left:930px;top:1000px;width:900px;display:flex;gap:10px}
#tl div{flex:1}
#tl i{display:block;height:4px;border-radius:2px;background:#2c3329;overflow:hidden}
#tl i b{display:block;height:100%;width:0;background:var(--lime)}
#tl span{display:block;margin-top:10px;font:700 13px DM;letter-spacing:2.5px;color:#6e7768;white-space:nowrap}
#corner{position:absolute;left:64px;top:44px;font:600 34px Cond;color:var(--paper);display:flex;gap:12px;align-items:center}
#corner2{position:absolute;right:64px;top:52px;font:600 14px DM;letter-spacing:3px;color:#7d8577}

#hook{position:absolute;inset:0;background:var(--ink)}
.bar{position:absolute;bottom:80px;width:56px;border-radius:10px 10px 3px 3px;background:#353d31}
#hookT1{position:absolute;left:110px;top:80px;font:600 330px/0.86 Cond;color:var(--paper);letter-spacing:-4px}
#hookT2{position:absolute;left:118px;top:380px;font:600 96px/1 Cond;color:var(--paper);text-transform:uppercase}
#hookT3{position:absolute;left:122px;top:478px;font:500 34px DM;color:#9aa293}
#peak{position:absolute;font:700 18px DM;letter-spacing:3px;color:var(--hot)}
#claw{position:absolute;inset:0}
#limeL{position:absolute;inset:0;background:var(--lime);color:var(--ink)}
#logo{position:absolute;left:0;right:0;top:300px;text-align:center;font:600 330px/1 Cond;letter-spacing:-6px;white-space:nowrap}
#logo span{display:inline-block}
#tagline{position:absolute;left:0;right:0;top:680px;text-align:center;font:500 40px DM;letter-spacing:.5px}
#verbs{position:absolute;left:0;right:0;top:730px;display:flex;justify-content:center;gap:16px}
#verbs div{padding:12px 24px;border-radius:40px;border:2.5px solid var(--ink);font:700 22px DM;letter-spacing:4px}
#credit{position:absolute;left:0;right:0;bottom:46px;text-align:center;font:500 16px DM;color:#3e4a24}
#stack{position:absolute;left:0;right:0;top:870px;text-align:center;font:600 22px DM;letter-spacing:3px}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%)}
</style></head>
<body>
<div id="stage">
  <div id="grid"></div><div id="glow"></div><div id="bignum">01</div>
  <div id="corner"></div>
  <div id="corner2">LONG-RUNNING AGENT · OPENCLAW + NEMOCLAW</div>
  <div id="side"></div>
  <div id="tl"></div>
  <div class="phoneWrap" id="phoneWrap"></div>
  <div id="vignette"></div>
  <div id="hook">
    <div id="bars"></div><div id="peak">18:00 · PACKED</div>
    <div id="hookT1">18:00.</div>
    <div id="hookT2"><div class="mask"><span>Every rack taken.</span></div></div>
    <div id="hookT3">Waiting for a bench. Again.</div>
  </div>
  <svg id="claw" viewBox="0 0 1920 1080"><g stroke="#d7f580" stroke-linecap="round" fill="none">
    <path id="s0" d="M1060 -120 L560 1200"/><path id="s1" d="M1250 -120 L750 1200"/><path id="s2" d="M1440 -120 L940 1200"/></g></svg>
  <div id="limeL">
    <div id="logo"></div><div id="tagline"></div><div id="verbs"></div>
    <div id="stack">OPENCLAW + NEMOCLAW · LONG-RUNNING TELEGRAM AGENT</div>
    <div id="credit">Simulated Telegram screens and demo data · Exercise art: Workout Guide / Bryl Lim / Everkinetic, CC BY-SA 4.0</div>
  </div>
</div>
<script src="lib.js"></script>
<script>
// ===================== chapter library =====================
// Each chapter: headline copy, a builder for its viz, and frame(t, a, ev) driven by cut-specific event times.
const DAYS=['MON','TUE','WED','THU','FRI','SAT','SUN'];
const CH_DEFS={
  setup:{kick:'SETUP',lines:['Set up in','one chat.'],
    sub:'Tell it your goal and <em>snap your plan</em>. It reads the photo and asks only what\'s missing.'},
  plan:{kick:'PLAN',lines:['Quietest hours,','auto-picked.'],
    sub:'Every Sunday it reads your <em>calendar</em> and the gym\'s <em>crowd history</em>, then picks the emptiest slots.'},
  replan:{kick:'REPLAN',lines:['Life happens.','It replans.'],
    sub:'New meeting, trip or sick day? It moves sessions to the <em>next quiet slot</em>. You never re-plan.'},
  watch:{kick:'WATCH',lines:['Watches the','crowd for you.'],
    sub:'Polls gym check-ins <em>every 15 min</em> and pings you when it\'s time to leave.'},
  watch60:{kick:'WATCH',lines:['Watches the','crowd for you.'],
    sub:'Polls check-ins <em>every 15 min</em>, tells you when to leave, and learns how busy it <em>actually felt</em>.'},
  coach:{kick:'COACH',lines:['Coaches you','set by set.'],
    sub:'Exercise images, target weights, rest timers. Log a set with one text: <em>80x10</em>.'},
  adapt:{kick:'ADAPT',lines:['Rack taken?','Plan B. Now.'],
    sub:'One tap on <em>Occupied</em> reorders the workout. Saved alternatives are one more tap away.'},
  progress:{kick:'PROGRESS',lines:['Remembers.','Progresses.'],
    sub:'Every set is saved. Hit all your reps and the next target <em>goes up</em>.'},
  hood:{kick:'UNDER THE HOOD',lines:['Runs on its own.','For months.'],
    sub:'Scheduled jobs wake the agent. Python tools <em>validate every action</em>. SQLite remembers everything.'},
};

// ---------- setup ----------
const PLAN_NOTE=`<h4>PUSH</h4><div>Bench 80kg 3×8-10</div><div>OHP 30kg 3×8-10</div><div>Triceps 25kg 2×12-15</div><h4 style="margin-top:12px">PULL</h4><div>Row 60 · Pulldown 55</div><h4 style="margin-top:12px">LEGS</h4><div>Leg press 120 · Curl 40</div>`;
const XROWS=[['bench-press','Bench press','80 KG · 3 × 8–10'],['overhead-press','Overhead press','30 KG · 3 × 8–10'],['tricep-pushdown','Tricep pushdown','25 KG · 2 × 12–15']];
function buildSetup(v){
  v.innerHTML=`<div class="note" id="note">${PLAN_NOTE}<div id="nScan"></div></div>`+
    XROWS.map(([s,n,d],i)=>`<div class="xrow" id="x${i}" style="top:${i*84}px"><img src="${IMG(s)}"><div><div class="n">${n}</div><div class="d">${d}</div></div></div>`).join('')+
    `<div class="xrow" id="xw" style="top:252px"><div style="width:52px;height:52px;border-radius:10px;display:grid;place-items:center;font:700 26px DM" id="xwi">?</div><div><div class="n">Bench warm-up</div><div class="d" id="xwd">MISSING · ASKED IN CHAT</div></div></div>
     <div class="tag line" id="xTag" style="left:380px;top:342px">PHOTO → STRUCTURED PLAN → SQLITE</div>`;
}
function setupFrame(t,a,ev){
  const n=$('#note'),np=spring(t-ev.photo,8,12);
  n.style.transform=`translate(${(1-clamp(np))*-200}px,${(1-clamp(np))*80}px) rotate(${lerp(-14,-4,clamp(np))}deg) scale(${lerp(.7,1,clamp(np))})`;
  n.style.opacity=clamp(np*3);
  const sp=seg(t,ev.scan[0],ev.scan[1]); $('#nScan').style.top=(sp*360)+'px'; $('#nScan').style.opacity=sp>0&&sp<1?1:0;
  ev.rows.forEach((at,i)=>{const el=$('#x'+i),p=spring(t-at,9,13);
    el.style.transform=`translateX(${(1-clamp(p))*-300}px) scale(${lerp(.6,1,clamp(p,0,1.1))})`;el.style.opacity=clamp(p*2)});
  const w=$('#xw'),wp=spring(t-ev.missing,9,13),filled=t>=ev.fill;
  w.style.transform=`translateX(${(1-clamp(wp))*-300}px)`; w.style.opacity=clamp(wp*2);
  w.style.borderColor=filled?'#d7f580':'#ff6a45';
  $('#xwi').textContent=filled?'50':'?'; $('#xwi').style.background=filled?'#d7f580':'rgba(255,106,69,.2)'; $('#xwi').style.color=filled?'#0f120e':'#ff6a45';
  $('#xwi').style.fontSize=filled?'22px':'26px';
  $('#xwd').textContent=filled?'50 KG · SAVED ✓':'MISSING · ASKED IN CHAT';
  if(filled){const b=oBack(seg(t,ev.fill,ev.fill+.35),2.5);w.style.transform=`scale(${lerp(1.06,1,b)})`}
  const tg=oExpo(seg(t,ev.tag,ev.tag+.4)); $('#xTag').style.opacity=tg; $('#xTag').style.transform=`translateY(${(1-tg)*14}px)`;
}

// ---------- plan heatmap ----------
const HOURS=['18:00','19:00','20:00','21:00'];
// Illustrative crowd levels (0 quiet → 1 packed) for the 18:00–22:00 training window.
const CROWD=[[.72,.28,.55,.42],[.92,.86,.62,.48],[.24,.74,.6,.4],[.95,.9,.7,.52],[.2,.52,.46,.38],[.66,.58,.52,.47],[.56,.5,.46,.44]];
const BUSY={'0,0':1}, REST={1:1,3:1,5:1,6:1};
const PICKS=[[0,1,'PUSH','19:45'],[2,0,'PULL','18:00'],[4,0,'LEGS','18:00']];
function crowdColor(v){
  const a=[44,58,36],b=[150,120,48],c=[255,106,69];
  const [p,q,k]=v<.5?[a,b,v/.5]:[b,c,(v-.5)/.5];
  return `rgb(${p.map((x,i)=>Math.round(lerp(x,q[i],k))).join(',')})`;
}
function buildPlan(v){
  let s='<div class="hm">';
  DAYS.forEach((d,i)=>s+=`<div class="axis" style="left:${i*106+30}px;top:-26px">${d}</div>`);
  HOURS.forEach((h,j)=>s+=`<div class="axis" style="left:-72px;top:${j*70+21}px">${h}</div>`);
  for(let i=0;i<7;i++)for(let j=0;j<4;j++){const busy=BUSY[i+','+j];
    s+=`<div class="cell${busy?' hatch':''}" id="c${i}_${j}" style="left:${i*106}px;top:${j*70}px;background:${crowdColor(CROWD[i][j])}">${busy?'<div class="lab" style="color:#c9d2e0;font-size:12px">MEETING</div>':''}</div>`}
  PICKS.forEach(([i,j,n,tm],k)=>s+=`<div class="cell" id="p${k}" style="left:${i*106}px;top:${j*70}px;background:var(--lime);box-shadow:0 0 0 4px rgba(215,245,128,.25),0 10px 30px rgba(215,245,128,.25)"><div class="lab">${n}<small>${tm}</small></div></div>`);
  s+=`<div class="tag" id="tagCal" style="left:420px;top:296px;border:2px solid #4a5363;color:#c9d2e0">▨ CALENDAR</div><div class="tag line" id="tagRest" style="left:576px;top:296px;color:#8a9284">REST DAYS</div>`;
  s+=`<div class="tag" id="tagQ" style="left:0;top:296px;color:#8a9284;padding-left:0">QUIET <span style="display:inline-block;width:140px;height:10px;border-radius:5px;margin:0 8px;vertical-align:1px;background:linear-gradient(90deg,${crowdColor(0)},${crowdColor(.5)},${crowdColor(1)})"></span> PACKED</div></div><div id="scan"></div>`;
  v.innerHTML=s;
}
function planFrame(t,a,ev){
  const k=ev.k;
  for(let i=0;i<7;i++)for(let j=0;j<4;j++){
    const c=$(`#c${i}_${j}`),p=spring(t-(a+.35*k+(i+j)*.045),11,16);
    const rest=REST[i]?lerp(1,.35,seg(t,a+1.05*k,a+1.05*k+.25)):1;
    c.style.transform=`scale(${clamp(p,0,1.2)})`; c.style.opacity=clamp(p*2)*rest;
  }
  const sp=ioCubic(seg(t,a+.75*k,a+1.35*k)),sc=$('#scan');
  sc.style.left=(70-10+sp*752)+'px'; sc.style.opacity=sp>0&&sp<1?1:0;
  PICKS.forEach((_,i)=>{const el=$('#p'+i),p=spring(t-(a+1.0*k+i*.13),10,15);el.style.transform=`scale(${p})`;el.style.opacity=clamp(p*3)});
  [['#tagQ',.45],['#tagCal',.6],['#tagRest',1.05]].forEach(([s,d])=>{const p=oExpo(seg(t,a+d*k,a+d*k+.4));$(s).style.opacity=p;$(s).style.transform=`translateY(${(1-p)*14}px)`});
}

// ---------- replan ----------
const HPX=64, H0=17; // px per hour, first hour on the axis
const blkY=h=>(h-H0)*HPX;
function buildReplan(v){
  let s='<div class="wk">';
  DAYS.forEach((d,i)=>s+=`<div class="axis" style="left:${i*112+32}px;top:-28px">${d}</div><div class="col" style="left:${i*112}px"></div>`);
  ['17:00','18:00','19:00','20:00','21:00'].forEach((h,j)=>s+=`<div class="axis" style="left:-72px;top:${j*HPX-8}px">${h}</div>`);
  s+=`<div class="blk" id="rPush" style="left:0;top:${blkY(19.75)}px;height:${HPX}px;background:var(--lime)">PUSH<small>19:45</small></div>
      <div class="blk" id="rPull" style="height:${HPX}px;background:var(--lime)">PULL<small id="rPullT">18:00</small></div>
      <div class="blk" id="rLegs" style="left:${4*112}px;top:${blkY(18)}px;height:${HPX}px;background:var(--lime)">LEGS<small>18:00</small></div>
      <div class="blk hatch" id="rDinner" style="left:${2*112}px;top:${blkY(17.5)}px;height:${2.5*HPX}px;color:#e3e8f0">TEAM<br>DINNER<small style="font-size:18px">17:30–20:00</small></div>
      <div class="blk hatch" id="rAway" style="left:${5*112}px;width:216px;top:4px;height:262px;color:#e3e8f0">✈️ AWAY<small style="font-size:18px">SAT–SUN</small></div>
      </div><div class="tag solid" id="rTag" style="left:70px;top:330px">✓ REPLANNED · PULL → THU 18:30, STILL QUIET</div>`;
  v.innerHTML=s;
}
function replanFrame(t,a,ev){
  ['#rPush','#rPull','#rLegs'].forEach((s,i)=>{const p=spring(t-(a+.3+i*.08),10,14);$(s).style.transform=`scale(${clamp(p,0,1.15)})`;$(s).style.opacity=clamp(p*2)});
  const d=$('#rDinner'),dp=spring(t-ev.drop,8,13);
  d.style.transform=`translateY(${(1-dp)*-260}px)`; d.style.opacity=clamp(dp*3);
  const mv=ioCubic(seg(t,ev.move[0],ev.move[1])),lift=Math.sin(mv*Math.PI);
  const conflict=t>=ev.conflict&&mv<1, shake=conflict&&t<ev.conflict+.35?Math.sin(t*110)*5:0;
  const pull=$('#rPull'); pull.style.left=(lerp(2,3,mv)*112+shake)+'px'; pull.style.top=(lerp(blkY(18),blkY(18.5),mv)-lift*90)+'px';
  pull.style.background=conflict?'#ff6a45':'#d7f580'; pull.style.zIndex=3;
  pull.style.boxShadow=mv>=1?'0 0 0 4px rgba(215,245,128,.25),0 10px 30px rgba(215,245,128,.3)':'';
  $('#rPullT').textContent=mv>.5?'18:30':'18:00';
  const aw=$('#rAway'),ap=spring(t-ev.away,8,13); aw.style.transform=`translateY(${(1-ap)*-280}px)`; aw.style.opacity=clamp(ap*3);
  const tg=oExpo(seg(t,ev.tag,ev.tag+.4)); $('#rTag').style.opacity=tg; $('#rTag').style.transform=`translateY(${(1-tg)*14}px)`;
}

// ---------- watch ----------
// Check-ins polled every 15 min, 17:00 → 19:30 (illustrative).
const POLLS=[22,26,31,34,33,29,25,21,18,16,14];
function buildWatch(v){
  const W=570,H=260,x0=40,y0=20,px=i=>x0+i*(W/(POLLS.length-1)),py=x=>y0+H-(x-8)/30*H;
  const d=POLLS.map((x,i)=>`${i?'L':'M'}${px(i).toFixed(1)} ${py(x).toFixed(1)}`).join(' ');
  let s=`<svg class="abs" style="left:0;top:20px" width="660" height="340" viewBox="0 0 660 340">`;
  for(let i=0;i<POLLS.length;i++)s+=`<line x1="${px(i)}" x2="${px(i)}" y1="${y0}" y2="${y0+H}" stroke="#262d23" stroke-width="1.5"/>`;
  s+=`<defs><linearGradient id="wg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#d7f580" stop-opacity=".28"/><stop offset="1" stop-color="#d7f580" stop-opacity="0"/></linearGradient></defs>

const CUT=CUTS[new URLSearchParams(location.search).get('cut')||'15'];
const H=CUT.hook.claw, C=CUT.hook.close, O=CUT.outro;
const CH=CUT.chapters;

// ===================== build =====================
function build(){
  $('#corner').innerHTML=`${LOGO(34)}gymclaw.`;
  $('#side').innerHTML=CH.map((c,i)=>{const d=CH_DEFS[c.id];
    return `<div class="ch" id="ch${i}"><div class="kick"><b></b>${String(i+1).padStart(2,'0')} · ${d.kick}</div>
      <div class="head"><div class="mask"><span>${d.lines[0]}</span></div><div class="mask"><span class="hl">${d.lines[1]}</span></div></div>
      <div class="sub">${d.sub}</div><div class="viz" id="${VIZ_ID[c.id]||c.id+'Viz'}"></div></div>`}).join('');
  CH.forEach(c=>BUILD[c.id](document.getElementById(VIZ_ID[c.id]||c.id+'Viz')));
  $('#tl').innerHTML=CH.map(c=>`<div><i><b></b></i><span>${CH_DEFS[c.id].kick.split(' ').pop()}</span></div>`).join('');
  const v=[2,1,1,1,1,2,6,10,13,11,9,10,12,11,10,13,19,28,34,29,20,12,7,4];
  $('#bars').innerHTML=v.map((x,i)=>`<div class="bar" id="h${i}" style="left:${120+i*70}px;height:${x/34*470}px;${i==18?'background:var(--hot)':i==17||i==19?'background:#8a4a38':''}"></div>`).join('')
   +[0,6,12,18].map(h=>`<div class="axis" style="left:${120+h*70}px;top:1012px">${String(h).padStart(2,'0')}:00</div>`).join('');
  $('#logo').innerHTML=[...'gymclaw.'].map(c=>`<span>${c}</span>`).join('');
  $('#verbs').innerHTML=['PLAN','WATCH','COACH','ADAPT','PROGRESS'].map(n=>`<div>${n}</div>`).join('');
  $('#hookT3').style.display=CUT.hook.line3?'block':'none';
}

// ===================== frame =====================
let phone;
function phonePose(t){
  const ent=oExpo(seg(t,C,C+.9));
  const ry=lerp(34,13,ent)+Math.sin(t*.55)*3.5, rx=lerp(10,4,ent)+Math.sin(t*.4+1)*1.6, rz=lerp(-5,-1.5,ent)+Math.sin(t*.3)*.6;
  const s=lerp(1.14,1,ent)*(1+phone.kick(t));
  $('#phone').style.transform=`translateY(${Math.sin(t*.9)*6}px) rotateY(${ry}deg) rotateX(${rx}deg) rotateZ(${rz}deg) scale(${s})`;
  $('#glare').style.transform=`translateX(${(ry-13)*10}px)`;
}
function hookFrame(t){
  const Hk=$('#hook'),visible=t<H+.55; Hk.style.display=visible?'block':'none';
  if(visible){
    for(let i=0;i<24;i++){const p=spring(t-(.05+Math.abs(i-18)*.022),10,13),el=$('#h'+i);
      el.style.transform=`scaleY(${clamp(p,0,1.15)})`+(i==18&&t>.6?` scaleX(${1+.04*Math.sin((t-.6)*22)})`:''); el.style.transformOrigin='50% 100%'}
    const t1=oExpo(seg(t,.08,.55));
    $('#hookT1').style.transform=`translateY(${(1-t1)*120}px) scale(${lerp(1.25,1,t1)})`; $('#hookT1').style.opacity=t1; $('#hookT1').style.transformOrigin='0 100%';
    $('#hookT2 span').style.transform=`translateY(${(1-oExpo(seg(t,.4,.85)))*112}%)`;
    if(CUT.hook.line3){const l3=oExpo(seg(t,CUT.hook.line3,CUT.hook.line3+.5));$('#hookT3').style.opacity=l3;$('#hookT3').style.transform=`translateY(${(1-l3)*20}px)`}
    const pk=oBack(seg(t,.55,.8)); $('#peak').style.left=(120+18*70-60)+'px'; $('#peak').style.top='486px';
    $('#peak').style.opacity=clamp(pk); $('#peak').style.transform=`translateY(${(1-pk)*20}px)`;
    // Camera pushes toward the peak while the claw tears through.
    const push=ioCubic(seg(t,H-.15,H+.55)),shake=t>H+.05&&t<H+.35?Math.sin(t*90)*7*(1-seg(t,H+.05,H+.35)):0;
    Hk.style.transform=`translate(${shake}px,${shake*.5}px) scale(${1+push*.12})`; Hk.style.transformOrigin='66% 60%';
  }
  $('#claw').style.display=t>H-.05&&t<H+.6?'block':'none';
  [0,1,2].forEach(i=>{const s=$('#s'+i),len=1420,d=ioCubic(seg(t,H+i*.05,H+.2+i*.05));
    s.setAttribute('stroke-dasharray',len); s.setAttribute('stroke-dashoffset',len*(1-d));
    s.setAttribute('stroke-width',lerp(26,820,iCubic(seg(t,H+.28,H+.52))))});
}
function limeFrame(t){
  const L=$('#limeL'),av=$('#avatar').getBoundingClientRect(),ax=av.left+av.width/2,ay=av.top+av.height/2;
  let r=-1;
  if(t>=H+.48&&t<C+.55) r=lerp(2400,0,iCubic(seg(t,C,C+.5)));
  if(t>=O) r=lerp(0,2400,iCubic(seg(t,O,O+.5)));
  L.style.display=r>0?'block':'none'; if(r<=0) return;
  L.style.clipPath=`circle(${r}px at ${ax}px ${ay}px)`;
  const intro=t<O, a=intro?H+.43:O+.3;
  $$('#logo span').forEach((s,i)=>{const p=spring(t-(a+i*.035),10,13);s.style.transform=`translateY(${(1-p)*260}px) rotate(${(1-clamp(p))*14}deg)`;s.style.opacity=clamp(p*3)});
  const out=intro?iCubic(seg(t,C,C+.4)):0, lg=$('#logo');
  lg.style.transform=`translate(${(ax-960)*out}px,${(ay-470)*out}px) scale(${lerp(1,.08,out)})`; lg.style.top=intro?'300px':'200px';
  const tp=oExpo(seg(t,a+.3,a+.7)),tg=$('#tagline');
  tg.textContent=intro?'Your always-on gym agent, in Telegram.':CUT.tagline;
  tg.style.opacity=tp*(1-out); tg.style.transform=`translateY(${(1-tp)*30}px)`; tg.style.top=intro?'660px':'618px';
  ['#verbs','#stack','#credit'].forEach(s=>$(s).style.display=intro?'none':'');
  if(!intro){
    $$('#verbs div').forEach((v,i)=>{const p=oBack(seg(t,O+.6+i*.06,O+.95+i*.06),2);v.style.transform=`scale(${p})`;v.style.opacity=clamp(p)});
    $('#stack').style.opacity=seg(t,O+.9,O+1.15); $('#credit').style.opacity=seg(t,O+.95,O+1.25);
  }
}
function render(t){
  const ci=CH.findIndex(c=>t>=c.a&&t<c.b);
  $('#grid').style.transform=`translate(${(t*18)%48}px,${(t*9)%48}px)`;
  $('#glow').style.transform=`scale(${1+.06*Math.sin(t*1.3)})`;
  const bn=$('#bignum'),ca=ci>=0?CH[ci].a:0,bnp=oExpo(seg(t,ca,ca+.7));
  bn.textContent=String(Math.max(ci,0)+1).padStart(2,'0'); bn.style.opacity=ci>=0?bnp:0; bn.style.transform=`translateX(${(1-bnp)*200+(t-ca)*-14}px)`;
  phonePose(t); phone.frame(t);
  CH.forEach((c,i)=>{const last=i===CH.length-1;
    if(chapter($('#ch'+i),t,c.a,c.b,{hold:last?O+.7:c.b})&&t>=c.a-.1) FRAME[c.id](t,c.a,c.ev)});
  $$('#tl b').forEach((b,i)=>b.style.width=seg(t,CH[i].a,CH[i].b)*100+'%');
  $$('#tl span').forEach((s,i)=>s.style.color=t>=CH[i].a?(t<CH[i].b?'#d7f580':'#a7ae9f'):'#4f574a');
  ['#tl','#corner','#corner2'].forEach(s=>$(s).style.opacity=seg(t,C+.1,C+.5));
  hookFrame(t); limeFrame(t);
}

// Sound cues for sound.py, derived from the same script so audio stays in sync.
function cues(){
  const c=[{kind:'hook',t:0,claw:H,flood:H+.48},{kind:'music',from:H+.6,to:O+.05,bpm:120},{kind:'outro',t:O}];
  CUT.msgs.forEach(m=>{if(m.at>0&&m.k!=='typing')c.push({kind:m.k==='user'||m.k==='userphoto'?'send':m.k==='chip'?'chip':'msg',t:m.at})});
  CUT.typed.forEach(ty=>{const n=Math.min(ty.text.length,10);for(let i=0;i<n;i++)c.push({kind:'key',t:ty.from+(ty.send-.1-ty.from)*i/n})});
  CUT.taps.forEach(tp=>c.push({kind:'tap',t:tp.at}));
  CUT.locks.forEach(l=>{c.push({kind:'unlock',t:l.out});l.notifs.forEach(n=>c.push({kind:'notif',t:n.at}))});
  CH.forEach((ch,i)=>{if(i)c.push({kind:'chapter',t:ch.a});
    const e=ch.ev;
    if(ch.id==='adapt'){c.push({kind:'stamp',t:e.busy},{kind:'swoosh',t:e.swap});if(e.alt)c.push({kind:'swoosh',t:e.alt})}
    if(ch.id==='progress')c.push({kind:'climb',t:ch.a+.1*e.k,step:.16*e.k},{kind:'ding',t:ch.a+.55*e.k});
    if(ch.id==='plan')PICKS.forEach((_,k)=>c.push({kind:'pick',t:ch.a+1.0*e.k+k*.13,n:k}));
    if(ch.id==='replan')c.push({kind:'drop',t:e.drop},{kind:'swoosh',t:e.move[0]},{kind:'drop',t:e.away});
    if(ch.id==='setup')c.push({kind:'scan',t:e.scan[0],dur:e.scan[1]-e.scan[0]},{kind:'ding',t:e.fill});
  });
  return c.sort((a,b)=>a.t-b.t);
}

build();
phone=Phone($('#phoneWrap'),CUT);
window.CUES=cues();
window.ready=boot(phone,render,CUT.duration);
