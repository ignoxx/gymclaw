[package]
name = "gymclaw"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
clap = { version = "4.6.7", features = ["derive", "env"] }
hex = "0.4.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
jiff = "0.2.38"
kamadak-exif = "0.6.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "multipart", "stream", "blocking"] }
rusqlite = { version = "0.40.2", features = ["bundled", "serde_json", "hooks"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }
