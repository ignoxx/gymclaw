[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gymclaw"
license = "MIT"
version = "0.1.0"
description = "Deterministic training domain for GymClaw"
requires-python = ">=3.12"
dependencies = ["sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "pydantic>=2.10,<3", "google-auth>=2.38,<3", "google-auth-oauthlib>=1.2,<2", "requests>=2.32,<3", "python-dateutil>=2.9,<3", "pillow>=11,<13", "icalendar>=6,<8", "recurring-ical-events>=3.3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["gymclaw*"]

[tool.setuptools.package-data]
gymclaw = ["migrations/script.py.mako", "web/*.html", "web/*.css", "web/*.js", "web/fonts/*", "assets/workout-guide/*.json", "assets/workout-guide/LICENSE*", "assets/workout-guide/*.md", "assets/workout-guide/*/*.svg", "assets/workout-guide/*/*.png"]

[tool.pytest.ini_options]
testpaths = ["gymclaw/tests"]
