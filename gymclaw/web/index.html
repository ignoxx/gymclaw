<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GymClaw</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="dashboard">
    <header class="header">
      <a class="brand" href="/">gymclaw<span>.</span></a>
      <span class="mode" id="mode">Demo</span>
      <span class="updated" id="updated"></span>
      <button id="refresh" aria-label="Refresh" title="Refresh">↻</button>
      <details class="info"><summary aria-label="About">i</summary><div><p id="data-notice">Synthetic demo data.</p><p>Exercise art: <a href="https://github.com/bryllim/workout-guide">Workout Guide</a>, Bryl Lim / Everkinetic, <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>.</p></div></details>
    </header>
    <div class="page-heading"><h1>Training</h1><span id="range"></span></div>
    <div id="load-error" role="alert" hidden>Can't reach GymClaw right now.</div>
    <div class="layout" hidden>
      <div class="column">
        <section class="panel" aria-labelledby="week-title">
          <div class="section-heading"><h2 id="week-title">Next 7 days</h2><span id="session-count"></span></div>
          <div class="week" id="week"></div>
        </section>
        <section class="panel" aria-labelledby="gym-title">
          <div class="section-heading"><h2 id="gym-title">Gym</h2><span id="polling"></span></div>
          <div class="count"><strong id="count">—</strong><div><span>checked in</span><small id="count-time"></small></div>
            <div class="legend"><span class="key today" id="legend-day">Today</span><span class="key typical" id="legend-typical"></span></div></div>
          <div id="chart" class="chart"></div>
        </section>
        <section class="activity" aria-labelledby="activity-title"><h2 id="activity-title">Activity</h2><div id="events"></div></section>
      </div>
      <section class="panel focus" id="focus" aria-live="polite"></section>
    </div>
  </main>
</body>
</html>
