# scripts/connect-personal-calendar fills YOUR_FEED_HOST (e.g. p42-caldav.icloud.com)
# into the ignored local copy and applies that, not this template. GET only.
preset:
  name: gymclaw-personal-calendar-read
  description: Read-only iCloud published calendar feed (busy times for scheduling)
network_policies:
  gymclaw_personal_calendar_read:
    name: gymclaw-personal-calendar-read
    endpoints:
      - host: YOUR_FEED_HOST
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "/published/**"}
    binaries:
      - {path: /usr/bin/python3.13}
