# Replace YOUR_STUDIO_ID privately. Apply resulting ignored local policy, not this template.
preset:
  name: gymclaw-crowd-read
  description: Read-only public MySports count and current-day relative utilization
network_policies:
  gymclaw_crowd_read:
    name: gymclaw-crowd-read
    endpoints:
      - host: www.mysports.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "/nox/public/v1/studios/YOUR_STUDIO_ID/utilization/v2/active-checkin"}
          - allow: {method: GET, path: "/nox/public/v1/studios/YOUR_STUDIO_ID/utilization/v2/today"}
    binaries:
      - {path: /usr/bin/python3.13}
