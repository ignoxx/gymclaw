# gymclaw on a single host (`docker compose up -d`).
# gymclaw sits on an internal network with no internet route; `egress` is its only way out.
# To expose the dashboard locally or behind your reverse proxy, see docker-compose.override.example.yaml
# and deploy/README.md.
services:
  gymclaw:
    # Built once by .github/workflows/image.yml; the host only pulls. Local build: deploy/README.md.
    image: &image ghcr.io/ignoxx/gymclaw:${GYMCLAW_IMAGE_TAG:-main}
    pull_policy: always
    restart: unless-stopped
    depends_on: [egress]
    environment:
      GYMCLAW_TELEGRAM_USER_ID: ${GYMCLAW_TELEGRAM_USER_ID:?}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?}
      # Optional: only `gymclaw calendar-auth` reads it; afterwards the DB stays bound to that calendar.
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      # Empty means unset: defaults live in src/config.rs (list: docs/self-hosting.md).
      GYMCLAW_MODEL: ${GYMCLAW_MODEL:-}
      GYMCLAW_PROVIDER: ${GYMCLAW_PROVIDER:-}
      GYMCLAW_MODEL_VISION: ${GYMCLAW_MODEL_VISION:-}
      GYMCLAW_MODEL_AUDIO: ${GYMCLAW_MODEL_AUDIO:-}
      # Telegram menu button opens the dashboard as a Mini App; unset leaves the "/" menu.
      GYMCLAW_DASHBOARD_HOST: ${GYMCLAW_DASHBOARD_HOST:-}
      TZ: ${TZ:-Europe/Berlin}
      # Seeds the profile timezone on first start; later changes go through the profile.
      GYMCLAW_TIMEZONE: ${TZ:-Europe/Berlin}
      HTTP_PROXY: http://egress:3128
      HTTPS_PROXY: http://egress:3128
      http_proxy: http://egress:3128
      https_proxy: http://egress:3128
    volumes:
      - gymclaw-data:/opt/gymclaw/data
      - gymclaw-backups:/backups
    # serve touches data/heartbeat every minute from the scheduler loop.
    healthcheck:
      test: [CMD-SHELL, 'test -n "$$(find /opt/gymclaw/data/heartbeat -mmin -3 2>/dev/null)"']
      interval: 60s
      timeout: 10s
      start_period: 120s
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    pids_limit: 512

  # Dashboard (the Mini App): serves the UI, authenticates /api/* with Telegram Mini App initData
  # (HMAC with TELEGRAM_BOT_TOKEN for GYMCLAW_TELEGRAM_USER_ID) on non-loopback hosts, and serves
  # the read-only /calendar/<token>.ics subscription feed. No internet access; attach your reverse
  # proxy or publish 127.0.0.1:8766 via docker-compose.override.yaml.
  dashboard:
    image: *image
    pull_policy: always
    restart: unless-stopped
    entrypoint: ["tini", "-s", "--"]
    command: ["gymclaw", "dashboard", "--addr", "0.0.0.0:8766", "--allowed-host", "${GYMCLAW_DASHBOARD_HOST:-gymclaw.localhost}"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?}
      GYMCLAW_TELEGRAM_USER_ID: ${GYMCLAW_TELEGRAM_USER_ID:?}
    healthcheck:
      test: [CMD, curl, -fsS, -o, /dev/null, "http://127.0.0.1:8766/"]
      interval: 60s
      timeout: 10s
    volumes:
      - gymclaw-data:/opt/gymclaw/data
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m

  egress:
    build: deploy/egress
    restart: unless-stopped
    environment:
      EGRESS_EXTRA_HOSTS: ${EGRESS_EXTRA_HOSTS:-}
    networks: [internal, egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

volumes:
  gymclaw-data:
  gymclaw-backups:

networks:
  internal:
    internal: true
  egress:
