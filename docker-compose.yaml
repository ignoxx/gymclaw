# GymClaw on a single host (Coolify "Docker Compose" build pack, or plain `docker compose up`).
# gymclaw sits on an internal network with no internet route; `egress` is its only way out.
# Setup and migration: deploy/README.md
services:
  gymclaw:
    # Built once by .github/workflows/image.yml; the host only pulls. Local build: deploy/README.md.
    image: &image ghcr.io/ignoxx/gymclaw:${GYMCLAW_IMAGE_TAG:-main}
    pull_policy: always
    restart: unless-stopped
    depends_on: [egress]
    environment:
      GYMCLAW_TELEGRAM_USER_ID: ${GYMCLAW_TELEGRAM_USER_ID:?}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?}
      # Only `gymclaw calendar-auth` reads it; afterwards the DB stays bound to that calendar.
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      GYMCLAW_MODEL: ${GYMCLAW_MODEL:-z-ai/glm-5.3-flash}
      GYMCLAW_PROVIDER: ${GYMCLAW_PROVIDER:-inference-net/fp4}
      GYMCLAW_MODEL_FAST: ${GYMCLAW_MODEL_FAST:-}
      GYMCLAW_MODEL_VISION: ${GYMCLAW_MODEL_VISION:-}
      TZ: ${TZ:-Europe/Berlin}
      # Seeds the profile timezone on first start; later changes go through the profile.
      GYMCLAW_TIMEZONE: ${TZ:-Europe/Berlin}
      HTTP_PROXY: http://egress:3128
      HTTPS_PROXY: http://egress:3128
      http_proxy: http://egress:3128
      https_proxy: http://egress:3128
    volumes:
      - gymclaw-data:/opt/gymclaw/data
      # Old OpenClaw workspace: USER.md owner notes are imported into the DB once on first start.
      - gymclaw-workspace:/opt/gymclaw/openclaw:ro
      - gymclaw-backups:/backups
    # serve touches data/heartbeat every minute from the scheduler loop.
    healthcheck:
      test: [CMD-SHELL, 'test -n "$$(find /opt/gymclaw/data/heartbeat -mmin -3 2>/dev/null)"']
      interval: 60s
      timeout: 10s
      start_period: 120s
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    pids_limit: 512

  # Dashboard: reads the DB, writes only the agent's notes. No internet and no published port: only the reverse proxy
  # reaches it, and only for Tailscale clients (100.64.0.0/10). See deploy/README.md.
  dashboard:
    image: *image
    pull_policy: always
    restart: unless-stopped
    entrypoint: ["tini", "-s", "--"]
    command: ["gymclaw", "dashboard", "--addr", "0.0.0.0:8766", "--allowed-host", "${GYMCLAW_DASHBOARD_HOST:-gymclaw.localhost}"]
    healthcheck:
      test: [CMD, curl, -fsS, -o, /dev/null, "http://127.0.0.1:8766/"]
      interval: 60s
      timeout: 10s
    volumes:
      - gymclaw-data:/opt/gymclaw/data
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    labels:
      - traefik.enable=true
      - traefik.http.routers.gymclaw-dashboard.rule=Host(`${GYMCLAW_DASHBOARD_HOST:-gymclaw.localhost}`)
      - traefik.http.routers.gymclaw-dashboard.entrypoints=https
      - traefik.http.routers.gymclaw-dashboard.tls=true
      - traefik.http.routers.gymclaw-dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.gymclaw-dashboard.middlewares=gymclaw-tailnet
      - traefik.http.routers.gymclaw-dashboard-http.rule=Host(`${GYMCLAW_DASHBOARD_HOST:-gymclaw.localhost}`)
      - traefik.http.routers.gymclaw-dashboard-http.entrypoints=http
      - traefik.http.routers.gymclaw-dashboard-http.middlewares=gymclaw-tailnet,gymclaw-https
      - traefik.http.middlewares.gymclaw-tailnet.ipallowlist.sourcerange=100.64.0.0/10,fd7a:115c:a1e0::/48
      - traefik.http.middlewares.gymclaw-https.redirectscheme.scheme=https
      - traefik.http.services.gymclaw-dashboard.loadbalancer.server.port=8766

  egress:
    build: deploy/egress
    restart: unless-stopped
    environment:
      EGRESS_EXTRA_HOSTS: ${EGRESS_EXTRA_HOSTS:-}
    networks: [internal, egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

volumes:
  gymclaw-data:
  gymclaw-workspace:
  gymclaw-backups:

networks:
  internal:
    internal: true
  egress:
